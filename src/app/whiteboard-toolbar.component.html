<div class="canvas-tools">
  <div class="color-menu"><button class="color-swatch primary" [style.backgroundColor]="selectedColor" aria-label="Open colors" [attr.aria-expanded]="colorsOpen" (click)="toggleColors()"></button><div class="color-options" [class.open]="colorsOpen"><button *ngFor="let color of colors" class="color-swatch" [style.backgroundColor]="color" [class.active]="selectedColor === color" [attr.aria-label]="'Use ' + color" (click)="selectColor(color)"></button></div></div>
  <div class="tool-row">
    <button *ngIf="selectToolDefinition as tool" class="tool-button" [class.active]="selectedTool === tool.id" [attr.aria-label]="tool.label" [title]="tool.label" (click)="selectTool(tool.id)"><app-icon [name]="tool.icon"></app-icon></button>
    <button *ngIf="freehandToolDefinition as tool" class="tool-button" [class.active]="selectedTool === tool.id" [attr.aria-label]="tool.label" [title]="tool.label" (click)="selectTool(tool.id)"><app-icon [name]="tool.icon"></app-icon></button>
    <div class="shape-menu"><button class="tool-button shape-trigger" [class.active]="isShapeToolSelected()" aria-label="Open shapes" [attr.aria-expanded]="shapesOpen" (click)="toggleShapes()"><app-icon name="shapes"></app-icon></button><div class="shape-options" [class.open]="shapesOpen"><button *ngFor="let tool of shapeTools" class="tool-button" [class.active]="selectedTool === tool.id" [attr.aria-label]="tool.label" [title]="tool.label" (click)="selectTool(tool.id)"><app-icon [name]="tool.icon"></app-icon></button></div></div>
    <button *ngFor="let tool of standaloneTools" class="tool-button" [class.active]="selectedTool === tool.id" [class.danger]="tool.id === 'clear'" [attr.aria-label]="tool.label" [title]="tool.label" (click)="selectTool(tool.id)"><app-icon [name]="tool.icon"></app-icon></button>
  </div>
</div>
